# The queues every example uses, created when the emulator starts, the way you would create them with
# Terraform or the console before deploying a service. The services themselves never create queues.
include classpath("application.conf")

aws {
  region = us-east-1
  accountId = "000000000000"
}

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

queues {
  # 5 s visibility timeout so a failed message comes back quickly; after 3 receives it goes to orders-dlq.
  orders {
    defaultVisibilityTimeout = 5 seconds
    deadLettersQueue {
      name = "orders-dlq"
      maxReceiveCount = 3
    }
  }
  orders-dlq {}
}
