{{- if .Values.postgresql.enabled }}
{{- $name := include "trailbeam.postgresName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
# A trial Postgres: one pod and one volume. No backups, no replication, no upgrades between major versions.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "trailbeam.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  password: {{ include "trailbeam.keep" (list .Values.postgresql.password $old "password") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "trailbeam.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "trailbeam.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "trailbeam.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "trailbeam.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "trailbeam.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      # The official image runs as postgres (uid 999) and owns its data directory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          args: ["-c", "max_locks_per_transaction={{ int .Values.postgresql.maxLocksPerTransaction }}"]
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: trailbeam }
            - { name: POSTGRES_DB, value: trailbeam }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: password } }
            # A subdirectory: the volume's root may hold lost+found, which initdb refuses.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, trailbeam, -d, trailbeam, -h, 127.0.0.1] }
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            exec: { command: [pg_isready, -U, trailbeam, -d, trailbeam, -h, 127.0.0.1] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgresql.persistence.size }} }
{{- end }}
