{{- include "trailbeam.validate" . -}}
{{- if or (not .Values.auth.existingSecret) .Values.store.url }}
{{- $name := include "trailbeam.fullname" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "trailbeam.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.auth.existingSecret }}
  # Read them with: kubectl get secret {{ $name }} -o jsonpath='{.data.token}' | base64 -d
  token: {{ include "trailbeam.keep" (list .Values.auth.token $old "token") }}
  receipt-hash-key: {{ include "trailbeam.keep" (list .Values.auth.receiptHashKey $old "receipt-hash-key") }}
  {{- end }}
  {{- if .Values.store.url }}
  store-url: {{ .Values.store.url | b64enc }}
  {{- end }}
{{- end }}
