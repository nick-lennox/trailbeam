# The load balancer of compose.yaml: round robin over the two Trailbeam replicas, no sticky sessions (any
# replica serves any request: the shared token and the session cookie are checked the same way on each).
events {}
http {
    upstream trailbeam {
        server trailbeam-1:4318 max_fails=1 fail_timeout=5s;
        server trailbeam-2:4318 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 4318;
        client_max_body_size 64m;
        location / {
            proxy_pass http://trailbeam;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The client's address, for the sign-in limit per address and the logs. The replicas believe it only
            # from an address in TRAILBEAM_TRUSTED_PROXY (compose.yaml).
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # A replica that is down, or whose store is unreachable (503), is skipped and the request goes to the
            # other one. Retrying an export (a POST) is safe: a span already stored is skipped by its key.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_read_timeout 60s;
        }
    }
}
