[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailbeam-store"
version = "0.1.0.dev0"
description = "Trailbeam store: receives Trailbeam OpenTelemetry spans over OTLP/HTTP, keeps them in SQLite and builds per-message SQS timelines."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
trailbeam-store = "trailbeam_store.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
