# Optional overlay for qv2-collector.yaml: also send traces to your own tracing backend, keeping every
# SQS span there while the rest of each trace is sampled.
#
#   QV2_BACKEND_ENDPOINT=http://jaeger:4318 otelcol-contrib --config qv2-collector.yaml --config backend.yaml
#
# This is the configuration QV-11 tested (recheck B1): with 1% tail sampling of everything else, the
# Collector kept 467 of 467 SQS spans from Python, 231 of 231 from Node.js and 354 of 354 from Java.
processors:
  # Drops every span that is neither a qv2 span nor a stock AWS SDK SQS span.
  filter/sqs_only:
    error_mode: ignore
    traces:
      span:
        - 'not (instrumentation_scope.name == "qv2" or attributes["rpc.service"] == "SQS" or (attributes["rpc.system"] == "aws-api" and attributes["rpc.service"] == "Sqs") or IsMatch(attributes["messaging.system"], "^(aws.sqs|aws_sqs|AmazonSQS)$") or attributes["messaging.system.name"] == "aws.sqs")'
  # Drops exactly the spans that filter/sqs_only keeps.
  filter/drop_sqs:
    error_mode: ignore
    traces:
      span:
        - 'instrumentation_scope.name == "qv2" or attributes["rpc.service"] == "SQS" or (attributes["rpc.system"] == "aws-api" and attributes["rpc.service"] == "Sqs") or IsMatch(attributes["messaging.system"], "^(aws.sqs|aws_sqs|AmazonSQS)$") or attributes["messaging.system.name"] == "aws.sqs"'
  tail_sampling/rest:
    decision_wait: 5s
    num_traces: 100000
    policies:
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:QV2_BACKEND_SAMPLING_PERCENTAGE:-10}

exporters:
  otlp_http/backend:
    endpoint: "${env:QV2_BACKEND_ENDPOINT}"

service:
  pipelines:
    # Every SQS span, stock and qv2, unsampled.
    traces/backend_sqs:
      receivers: [otlp]
      processors: [filter/sqs_only, batch]
      exporters: [otlp_http/backend]
    # Everything else, tail-sampled.
    traces/backend_rest:
      receivers: [otlp]
      processors: [filter/drop_sqs, tail_sampling/rest, batch]
      exporters: [otlp_http/backend]
