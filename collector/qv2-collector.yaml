# qv2 OpenTelemetry Collector configuration: keeps every qv2 span and forwards it to the qv2 store.
#
# Run on its own:         otelcol-contrib --config qv2-collector.yaml
# With a tracing backend: otelcol-contrib --config qv2-collector.yaml --config backend.yaml
#
# Applications export OTLP to this Collector (4318 HTTP, 4317 gRPC). Spans whose instrumentation scope
# is `qv2` (docs/span-contract.md) go to the store, with no sampling on the way. Nothing else goes to the
# store. See README.md for the environment variables.
receivers:
  otlp:
    protocols:
      http:
        endpoint: "${env:QV2_COLLECTOR_HTTP_ENDPOINT:-localhost:4318}"
      grpc:
        endpoint: "${env:QV2_COLLECTOR_GRPC_ENDPOINT:-localhost:4317}"

processors:
  # The filter processor drops the spans that match. This keeps the qv2 spans and drops the rest.
  filter/qv2_only:
    error_mode: ignore
    traces:
      span:
        - 'instrumentation_scope.name != "qv2"'
  batch: {}

exporters:
  otlp_http/qv2_store:
    # The store's OTLP/HTTP base URL; the exporter appends /v1/traces.
    endpoint: "${env:QV2_STORE_ENDPOINT:-http://localhost:4319}"
    compression: gzip
    retry_on_failure:
      enabled: true
      # Keep retrying while the store is down, until the in-memory queue is full (default 5m).
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 5000

service:
  pipelines:
    traces/qv2:
      receivers: [otlp]
      processors: [filter/qv2_only, batch]
      exporters: [otlp_http/qv2_store]
