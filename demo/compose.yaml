# Trailbeam local demo: an SQS emulator, the Collector, the Trailbeam, and a producer and consumers in Python and
# Node.js. No AWS account and no AWS credentials: the SDKs get dummy keys and talk only to the emulator. Next to
# them, a RabbitMQ 4 broker with a publisher and a consumer in Python (the pika hooks, QV-309).
#
#   docker compose -f demo/compose.yaml up -d --build
#   open http://127.0.0.1:4318/
#
# Message flow: producer --SendMessage--> orders (ElasticMQ) --ReceiveMessage--> consumers / deleter
#               rabbitmq-publisher --basic.publish--> rmq-orders (RabbitMQ quorum queue) --basic.deliver--> rabbitmq-consumer
# Span flow:    every driver --OTLP/HTTP--> collector:4318 --Trailbeam spans only--> trailbeam:4318 (Trailbeam and its web screen)
#
# See demo/README.md. The concurrency check (demo/check.sh) reuses these images with `docker compose run`.
#
# The project name is trailbeam-demo unless you set another one with `docker compose -p NAME` or
# COMPOSE_PROJECT_NAME=NAME (both override the line below). Containers, volumes, the network and the local
# image tags (NAME-python:local and so on) all follow it, so a second checkout with its own name, and its own
# TRAILBEAM_DEMO_PORT, doesn't replace the first one's containers, timelines or images.
name: trailbeam-demo

x-sdk-env: &sdk-env
  TRAILBEAM_DEMO_SQS_ENDPOINT: http://sqs:9324
  TRAILBEAM_OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
  # Shared by every service on the same queues, so deletes join to receives across processes. Unset, the
  # packages use the published default key and the screen shows a notice about it.
  TRAILBEAM_RECEIPT_HASH_KEY: ${TRAILBEAM_RECEIPT_HASH_KEY:-}
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: demo-not-a-real-key
  AWS_SECRET_ACCESS_KEY: demo-not-a-real-secret

x-python: &python
  build: { context: .., dockerfile: demo/python/Dockerfile }
  image: ${COMPOSE_PROJECT_NAME:-trailbeam-demo}-python:local
  init: true
  environment: *sdk-env
  volumes: [truth:/truth]
  depends_on: [sqs, collector]

x-node: &node
  build: { context: .., dockerfile: demo/node/Dockerfile }
  image: ${COMPOSE_PROJECT_NAME:-trailbeam-demo}-node:local
  init: true
  environment: *sdk-env
  volumes: [truth:/truth]
  depends_on: [sqs, collector]

services:
  sqs:
    image: softwaremill/elasticmq-native:1.6.15

  collector:
    build: { context: .., dockerfile: demo/collector-image/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-trailbeam-demo}-collector:local
    environment:
      TRAILBEAM_COLLECTOR_HTTP_ENDPOINT: 0.0.0.0:4318
      TRAILBEAM_COLLECTOR_GRPC_ENDPOINT: 0.0.0.0:4317
      TRAILBEAM_ENDPOINT: http://trailbeam:4318
    depends_on: [trailbeam]

  trailbeam:
    build: { context: .., dockerfile: Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-trailbeam-demo}-trailbeam:local
    ports:
      - "127.0.0.1:${TRAILBEAM_DEMO_PORT:-4318}:4318"
    environment:
      TRAILBEAM_STUCK_AFTER_S: "60"
      # The redrive policy of `orders` below, so a timeline can say "not seen on the DLQ yet" (QV-33).
      TRAILBEAM_MAX_RECEIVE_COUNT: orders=3
    volumes: [trailbeam-data:/data]

  # The demo workload on the queue `orders`: one message a second, a mix of kinds (see python/trailbeamdemo.py),
  # consumed by a Python process and a Node.js process at the same time. Visibility timeout 10 s and
  # maxReceiveCount 3, so redeliveries and the dead-letter queue show up within a minute.
  producer:
    <<: *python
    command: ["produce", "--queue", "orders", "--interval", "1", "--mix", "demo", "--visibility-timeout", "10"]

  consumer-python:
    <<: *python
    command: ["consume", "--queue", "orders", "--threads", "4", "--wait", "5", "--dlq",
              "--visibility-timeout", "10", "--deleter", "http://deleter:8080"]

  consumer-node:
    <<: *node
    command: ["consume", "--queue", "orders", "--consumers", "4", "--wait", "5",
              "--visibility-timeout", "10", "--deleter", "http://deleter:8080"]

  deleter:
    <<: *python
    command: ["deleter", "--queue", "orders", "--port", "8080", "--visibility-timeout", "10"]

  # RabbitMQ (contract/span-contract-amqp.md): one message a second on the quorum queue rmq-orders, a mix of kinds (see
  # python/rabbitmqdemo.py): acked, requeued once, redelivered after the consumer's connection closed, and refused
  # into the dead-letter queue rmq-orders-dlq. The broker's guest user may connect only from localhost, hence a user.
  rabbitmq:
    image: rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo-not-a-secret
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  rabbitmq-publisher:
    <<: *python
    entrypoint: ["python", "/app/rabbitmqdemo.py"]
    command: ["produce", "--interval", "1"]
    environment: &rabbitmq-env
      TRAILBEAM_DEMO_AMQP_URL: amqp://demo:demo-not-a-secret@rabbitmq:5672/%2F
      TRAILBEAM_OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
    volumes: []
    depends_on:
      rabbitmq: { condition: service_healthy }
      collector: { condition: service_started }

  rabbitmq-consumer:
    <<: *python
    entrypoint: ["python", "/app/rabbitmqdemo.py"]
    command: ["consume"]
    environment: *rabbitmq-env
    volumes: []
    depends_on:
      rabbitmq: { condition: service_healthy }
      collector: { condition: service_started }

  # The concurrency checker, used only by demo/check.sh (`docker compose run`); `up` doesn't start it.
  checker:
    build: { context: .., dockerfile: demo/check/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-trailbeam-demo}-checker:local
    profiles: [check]
    volumes: [truth:/truth]

volumes:
  trailbeam-data:
  truth:
