# The conformance bench's Collector: every span it receives over OTLP/HTTP goes to one file (no batching, no
# sampling), so the checker sees exactly what the package exported. The one change: each span gets
# kit.collector.received_unix_nano, the moment the Collector received it. The Lambda checks use it to see
# that a wrapper's receive spans arrived before the handler started (contract 4.2). The checker ignores it
# everywhere else; it is not a trailbeam.* attribute.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  transform/arrival:
    error_mode: ignore
    trace_statements:
      - set(span.attributes["kit.collector.received_unix_nano"], UnixNano(Now()))
exporters:
  file:
    path: /out/spans.jsonl
    format: json
    flush_interval: 200ms
service:
  telemetry:
    logs: {level: warn}
  pipelines:
    traces: {receivers: [otlp], processors: [transform/arrival], exporters: [file]}
