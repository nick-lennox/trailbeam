name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels that PR's older run, so the runners
# runners never spend time on outdated commits. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q --ignore=tests/conformance
      - name: Store conformance suite (SQLite)
        run: pytest -q tests/conformance
      - name: A SQLite install gets no Postgres driver
        run: |
          python -m venv "$RUNNER_TEMP/plain" && "$RUNNER_TEMP/plain"/bin/pip install -q '.[server]'
          ! "$RUNNER_TEMP/plain"/bin/pip show psycopg psycopg-binary psycopg-pool 2>/dev/null | grep -q '^Name'
          "$RUNNER_TEMP/plain"/bin/python -c "import sys, trailbeam.server.__main__; assert not any(m.startswith('psycopg') for m in sys.modules)"

  perf:
    # The QV-68 regression check (python/bench/README.md#ci-regression-check): the receipt-hash join plans on a
    # seeded ~100k-span file, in-process insert speed, page p95 and 1,000 spans/s of ingest through the server,
    # with limits that fail the build. Then the same check on a deliberately broken (scanning) join plan, which
    # must fail it: that step passes only if the check caught the break.
    name: Perf regression check (100k spans)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Join plans and thresholds
        run: python bench/ci_check.py --out "$RUNNER_TEMP/ci-perf"
      - name: The check fails on a broken join plan
        if: success() || failure()
        run: python bench/ci_check.py --out "$RUNNER_TEMP/ci-perf-broken" --break-plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-regression-check
          path: |
            ${{ runner.temp }}/ci-perf/
            ${{ runner.temp }}/ci-perf-broken/

  postgres:
    # The Postgres store (TRAILBEAM_STORE_URL) on the oldest supported version and the current one.
    name: Postgres ${{ matrix.postgres }} store
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432   # random host port: several runners share one machine
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at this job's Postgres (random host port)
        run: echo "TRAILBEAM_TEST_POSTGRES_URL=postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,postgres]'
      - name: Store conformance suite and contract fixtures (SQLite and Postgres)
        run: pytest -q tests/conformance
      - name: Postgres store tests
        run: pytest -q tests/server/test_postgres.py

  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.15
        ports:
          - 9324   # random host port: several runners share one machine
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at this job's ElasticMQ (random host port)
        run: echo "TRAILBEAM_TEST_SQS_ENDPOINT=http://localhost:${{ job.services.elasticmq.ports['9324'] }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test


  ui:
    name: Shared UI (@trailbeam/ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run   # the package the hosted app installs: compiled views and the shared fixtures

  collector:
    name: Collector configuration
    runs-on: ubuntu-latest
    env:
      OTELCOL_VERSION: "0.165.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download otelcol-contrib
        run: |
          curl -sSfL -o $RUNNER_TEMP/otelcol.tgz "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          tar -xzf $RUNNER_TEMP/otelcol.tgz -C "$RUNNER_TEMP" otelcol-contrib
          $RUNNER_TEMP/otelcol-contrib --version
      - run: pip install pytest opentelemetry-proto
      - run: TRAILBEAM_OTELCOL_BIN=$RUNNER_TEMP/otelcol-contrib pytest -q collector/tests

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TB_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "TB_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: Build the image (local only, not pushed)
        run: docker build -t "$TB_NAME:ci" .
      - name: Run it with SQLite on a volume
        run: |
          docker volume create "$TB_NAME-data"
          docker run -d --name "$TB_NAME" -p "127.0.0.1:$TB_PORT:4318" -v "$TB_NAME-data:/data" "$TB_NAME:ci"
      - name: Send recorded spans, check the timeline page
        run: python3 python/smoke/smoke_test.py "http://127.0.0.1:$TB_PORT"
      - name: Stops cleanly and keeps the data on the volume
        run: |
          time docker stop -t 5 "$TB_NAME"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$TB_NAME")" = 0
          docker run --rm -v "$TB_NAME-data:/data" --entrypoint ls "$TB_NAME:ci" -l /data
          docker rm "$TB_NAME"
          docker run -d --name "$TB_NAME" -p "127.0.0.1:$TB_PORT:4318" -v "$TB_NAME-data:/data" "$TB_NAME:ci"
          python3 python/smoke/smoke_test.py "http://127.0.0.1:$TB_PORT"
          test "$(docker inspect -f '{{.State.Health.Status}}' "$TB_NAME")" != unhealthy
      - name: Container logs
        if: always()
        run: docker logs "$TB_NAME" || true
      - name: Remove this job's container, volume and image
        if: always()
        run: |
          docker rm -f "$TB_NAME" || true
          docker volume rm -f "$TB_NAME-data" || true
          docker image rm -f "$TB_NAME:ci" || true

  demo:
    name: Local demo (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TB_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "TB_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: Build and start the demo (images local only, not pushed)
        run: COMPOSE_PROJECT_NAME="$TB_NAME" TRAILBEAM_DEMO_PORT="$TB_PORT" docker compose -f demo/compose.yaml up -d --build --wait
      - name: Timelines from the Python and Node.js consumers reach Trailbeam
        run: python3 demo/smoke_test.py "http://127.0.0.1:$TB_PORT" --timeout 180
      - name: Logs
        if: always()
        run: COMPOSE_PROJECT_NAME="$TB_NAME" docker compose -f demo/compose.yaml logs --tail 50 || true
      - name: Stop
        if: always()
        run: COMPOSE_PROJECT_NAME="$TB_NAME" docker compose -f demo/compose.yaml down -v --remove-orphans || true

  concurrency-check:
    name: Concurrency check (3 processes x 4 consumers, 200 messages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TRAILBEAM_DEMO_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Checker unit tests
        run: pytest -q demo/check/tests
      # The 0.1 check on the emulator: 200 of 200 complete, in order (no effect shown before its cause),
      # joined, with the right receive counts and deleted, in each language (demo/README.md#concurrency-check).
      # It fails the build. The resolved shares per kind and source, and the 90% floor's result, are
      # reported in the job summary, but on the emulator check.sh doesn't gate on the floor (as locally);
      # it gates in concurrency-check-aws: ElasticMQ stamps SentTimestamp and
      # ApproximateFirstReceiveTimestamp in the same millisecond, so send->receive stays concurrent here
      # for a reason that is the emulator's, not Trailbeam's (demo/README.md#the-floor-in-ci).
      # --dlq: a poison message every 20 goes to the dead-letter queue; each move must be observed
      # (DeadLetterQueueSourceArn), none inferred. Emulator only: not approved on real SQS yet (QV-33).
      - name: Python
        id: python
        run: demo/check.sh --dlq python 200
      - name: Node.js
        id: node
        if: success() || steps.python.conclusion == 'failure'
        run: demo/check.sh --dlq node 200
      - name: Summary
        if: always()
        run: |
          {
            echo "### Concurrency check: python ${{ steps.python.outcome }}, node ${{ steps.node.outcome }}"
            for f in demo/results/*.txt; do echo; echo "\`$f\`"; echo '```'; cat "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-check-results
          path: demo/results/
      # check.sh leaves the stack up for local reruns; on a runner it would pile up and use up Docker's networks
      - name: Tear down
        if: always()
        run: docker compose -f demo/compose.yaml down -v --remove-orphans || true

  concurrency-check-aws:
    # The same check against real SQS in us-east-1, with the 90% floor gating (demo/README.md#the-floor-in-ci).
    # Needs the repository secrets QV2_AWS_ACCESS_KEY_ID and QV2_AWS_SECRET_ACCESS_KEY (an IAM user limited
    # to sqs:* on qv2-measure-*). It fails, rather than skips, when they are missing, so the floor can't stop
    # gating unnoticed. Pull requests from forks get no secrets, so it runs on pushes and same-repo PRs only.
    name: Concurrency check on real SQS (floor gating)
    # Real AWS calls, the slowest job and timing-sensitive: main only. PRs get the emulator check above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: real-sqs
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.QV2_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.QV2_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TRAILBEAM_DEMO_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: The AWS secrets are set
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Repository secrets QV2_AWS_ACCESS_KEY_ID and QV2_AWS_SECRET_ACCESS_KEY are not set; the send->receive floor can't be checked."
            exit 1
          fi
      # Queues are qv2-measure-<run> and qv2-measure-<run>-dlq, deleted when each run ends.
      - name: Python
        id: python
        run: demo/check.sh --aws python 200
      - name: Node.js
        id: node
        if: success() || steps.python.conclusion == 'failure'
        run: demo/check.sh --aws node 200
      - name: Summary
        if: always()
        run: |
          {
            echo "### Concurrency check on real SQS: python ${{ steps.python.outcome }}, node ${{ steps.node.outcome }}"
            for f in demo/results/*.txt; do echo; echo "\`$f\`"; echo '```'; cat "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-check-aws-results
          path: demo/results/
      # check.sh leaves the stack up for local reruns; on a runner it would pile up and use up Docker's networks
      - name: Tear down
        if: always()
        run: docker compose -f demo/compose.yaml down -v --remove-orphans || true
