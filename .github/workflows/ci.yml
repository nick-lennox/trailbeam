name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels that PR's older run, so the runners
# runners never spend time on outdated commits. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q --ignore=tests/conformance
      - name: Store conformance suite (SQLite)
        run: pytest -q tests/conformance
      - name: A SQLite install gets no Postgres driver
        run: |
          python -m venv "$RUNNER_TEMP/plain" && "$RUNNER_TEMP/plain"/bin/pip install -q '.[server]'
          ! "$RUNNER_TEMP/plain"/bin/pip show psycopg psycopg-binary psycopg-pool 2>/dev/null | grep -q '^Name'
          "$RUNNER_TEMP/plain"/bin/python -c "import sys, trailbeam.server.__main__; assert not any(m.startswith('psycopg') for m in sys.modules)"

  perf:
    # The QV-68 regression check (python/bench/README.md#ci-regression-check): the receipt-hash join plans on a
    # seeded ~100k-span file, in-process insert speed, page p95 and 1,000 spans/s of ingest through the server,
    # with limits that fail the build. Then the same check on a deliberately broken (scanning) join plan, which
    # must fail it: that step passes only if the check caught the break.
    name: Perf regression check (100k spans)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Join plans and thresholds
        run: python bench/ci_check.py --out "$RUNNER_TEMP/ci-perf"
      - name: The check fails on a broken join plan
        if: success() || failure()
        run: python bench/ci_check.py --out "$RUNNER_TEMP/ci-perf-broken" --break-plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-regression-check
          path: |
            ${{ runner.temp }}/ci-perf/
            ${{ runner.temp }}/ci-perf-broken/

  postgres:
    # The Postgres store (TRAILBEAM_STORE_URL) on the oldest supported version and the current one.
    name: Postgres ${{ matrix.postgres }} store
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432   # random host port: several runners share one machine
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at this job's Postgres (random host port)
        run: echo "TRAILBEAM_TEST_POSTGRES_URL=postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,postgres]'
      - name: Store conformance suite and contract fixtures (SQLite and Postgres)
        run: pytest -q tests/conformance
      - name: Postgres store tests
        run: pytest -q tests/server/test_postgres.py
      - name: Fault tests on Postgres (SIGKILL, retries, disorder, a replica killed)
        run: pytest -q tests/server/test_faults.py
      - name: People, sessions and sign-in on Postgres
        run: >-
          pytest -q tests/server/test_account_tables.py tests/server/test_accounts.py tests/server/test_access.py
          tests/server/test_first_admin.py tests/server/test_cli.py
      - name: Two replicas on one Postgres (the token, sessions and the switch to accounts on both)
        run: pytest -q tests/server/test_replicas_e2e.py

  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.15
        ports:
          - 9324   # random host port: several runners share one machine
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - name: Point the tests at this job's ElasticMQ (random host port)
        run: echo "TRAILBEAM_TEST_SQS_ENDPOINT=http://localhost:${{ job.services.elasticmq.ports['9324'] }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  conformance:
    # conformance/: each package's driver runs the scripted scenario against ElasticMQ, and its spans are
    # checked against contract/span-contract.md, alone, beside the application's own OpenTelemetry, with the
    # application's sampler at 0, and with body capture on.
    name: Conformance kit (Python and Node.js packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ./python boto3 pytest
      - run: npm ci
        working-directory: node
      - name: The checker against recorded runs, and against them broken one rule at a time
        run: pytest -q conformance/tests
      - name: Python and Node.js packages on the bench, client hooks and Lambda wrappers (every variant)
        run: >-
          python conformance/kit.py run
          conformance/drivers/python/driver.json conformance/drivers/node/driver.json
          conformance/drivers/python-lambda/driver.json conformance/drivers/node-lambda/driver.json
          --workdir "$RUNNER_TEMP/kit"
      - name: Keep the report, driver logs and spans (not the ground truth, which holds the bench's raw receipt handles)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kit
          path: |
            ${{ runner.temp }}/kit/report.json
            ${{ runner.temp }}/kit/bench.log
            ${{ runner.temp }}/kit/*.driver.log
            ${{ runner.temp }}/kit/*.setup.log
            ${{ runner.temp }}/kit/*.function.log
            ${{ runner.temp }}/kit/collector/spans.jsonl
          if-no-files-found: ignore

  java:
    # java/: the AWS SDK for Java v2 package (QV-319). Unit tests (contract vectors, a real SDK client over a
    # canned HTTP layer), then the conformance kit on the installed jar: alone, beside the OpenTelemetry Java
    # agent (also with its sampler at 0) and beside dd-java-agent; and the Lambda wrapper in the java:21 Lambda
    # base image, whose Dockerfile builds the jar from java/ itself.
    name: Java package (unit tests and conformance kit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: Unit tests, relocated jar, install to the local repository
        run: mvn -B -ntp -f java/pom.xml install
      - name: Build the conformance driver on the installed jar
        run: mvn -B -ntp -f conformance/drivers/java/pom.xml package
      - name: Fetch the agents the jar must work beside
        run: |
          mkdir -p "$RUNNER_TEMP/agents"
          curl -sSfL -o "$RUNNER_TEMP/agents/otel.jar" https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.34.0/opentelemetry-javaagent.jar
          curl -sSfL -o "$RUNNER_TEMP/agents/dd.jar" https://repo1.maven.org/maven2/com/datadoghq/dd-java-agent/1.69.1/dd-java-agent-1.69.1.jar
      - name: Java package on the bench, interceptor and Lambda wrapper (every variant)
        env:
          OTEL_JAVA_AGENT_JAR: ${{ runner.temp }}/agents/otel.jar
          DD_JAVA_AGENT_JAR: ${{ runner.temp }}/agents/dd.jar
        run: >-
          python conformance/kit.py run
          conformance/drivers/java/driver.json conformance/drivers/java-lambda/driver.json
          --workdir "$RUNNER_TEMP/kit"
      - name: Keep the report, driver logs and spans (not the ground truth, which holds the bench's raw receipt handles)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kit-java
          path: |
            ${{ runner.temp }}/kit/report.json
            ${{ runner.temp }}/kit/bench.log
            ${{ runner.temp }}/kit/*.driver.log
            ${{ runner.temp }}/kit/*.setup.log
            ${{ runner.temp }}/kit/*.function.log

  ui:
    name: Shared UI (@trailbeam/ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run   # the package the hosted app installs: compiled views and the shared fixtures

  collector:
    name: Collector configuration
    runs-on: ubuntu-latest
    env:
      OTELCOL_VERSION: "0.165.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download otelcol-contrib
        run: |
          curl -sSfL -o $RUNNER_TEMP/otelcol.tgz "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          tar -xzf $RUNNER_TEMP/otelcol.tgz -C "$RUNNER_TEMP" otelcol-contrib
          $RUNNER_TEMP/otelcol-contrib --version
      - run: pip install pytest opentelemetry-proto
      - run: TRAILBEAM_OTELCOL_BIN=$RUNNER_TEMP/otelcol-contrib pytest -q collector/tests

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TB_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "TB_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: Build the image (local only, not pushed)
        run: docker build -t "$TB_NAME:ci" .
      # npx trailbeam start runs the image of the package's version with `start` (node/bin/trailbeam.js), so an
      # image without the start command would ship a launcher that can't run (QV-207: image 0.3.0 has none and
      # prints the plain `usage: trailbeam`). Checked through the launcher itself, pointed at this build.
      - name: The launcher's start --help is answered by the image's trailbeam start
        run: |
          TRAILBEAM_IMAGE="$TB_NAME:ci" node node/bin/trailbeam.js start --port "$TB_PORT" --help > "$RUNNER_TEMP/start-help.txt"
          cat "$RUNNER_TEMP/start-help.txt"
          grep -q '^usage: trailbeam start ' "$RUNNER_TEMP/start-help.txt" \
            || { echo "::error::the image has no trailbeam start command (start --help printed something else)"; exit 1; }
      - name: Run it with SQLite on a volume
        run: |
          docker volume create "$TB_NAME-data"
          docker run -d --name "$TB_NAME" -p "127.0.0.1:$TB_PORT:4318" -v "$TB_NAME-data:/data" "$TB_NAME:ci"
      - name: Send recorded spans, check the timeline page
        run: python3 python/smoke/smoke_test.py "http://127.0.0.1:$TB_PORT"
      - name: Stops cleanly and keeps the data on the volume
        run: |
          time docker stop -t 5 "$TB_NAME"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$TB_NAME")" = 0
          docker run --rm -v "$TB_NAME-data:/data" --entrypoint ls "$TB_NAME:ci" -l /data
          docker rm "$TB_NAME"
          docker run -d --name "$TB_NAME" -p "127.0.0.1:$TB_PORT:4318" -v "$TB_NAME-data:/data" "$TB_NAME:ci"
          python3 python/smoke/smoke_test.py "http://127.0.0.1:$TB_PORT"
          test "$(docker inspect -f '{{.State.Health.Status}}' "$TB_NAME")" != unhealthy
      - name: Container logs
        if: always()
        run: docker logs "$TB_NAME" || true
      - name: Remove this job's container, volume and image
        if: always()
        run: |
          docker rm -f "$TB_NAME" || true
          docker volume rm -f "$TB_NAME-data" || true
          docker image rm -f "$TB_NAME:ci" || true

  upgrade:
    # A store written by the published 0.3.0 keeps working under this checkout, and 0.3.0 can't damage it after.
    # python/smoke/upgrade_check.py says what is checked.
    name: Upgrade from 0.3.0 (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, sqlite-image, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432   # random host port: several runners share one machine
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,postgres]'
      - name: 0.3.0 from PyPI, in a venv of its own
        if: matrix.store != 'sqlite-image'
        run: |
          python -m venv "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/old/bin/pip" install -q 'trailbeam[server,postgres]==0.3.0'
      - name: SQLite, trailbeam start on the data directory 0.3.0 used
        if: matrix.store == 'sqlite'
        run: python smoke/upgrade_check.py --store sqlite --old-cmd "$RUNNER_TEMP/old/bin/trailbeam" --new-cmd trailbeam
      - name: Postgres
        if: matrix.store == 'postgres'
        run: >-
          python smoke/upgrade_check.py --store postgres --old-cmd "$RUNNER_TEMP/old/bin/trailbeam" --new-cmd trailbeam
          --pg-url "postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
      - name: SQLite, the published 0.3.0 image, then this checkout's image, on one volume
        if: matrix.store == 'sqlite-image'
        run: |
          echo "TB_IMAGE=tbci-${{ github.run_id }}-${{ github.run_attempt }}-upgrade:ci" >> "$GITHUB_ENV"
          docker build -t "tbci-${{ github.run_id }}-${{ github.run_attempt }}-upgrade:ci" ..
          python smoke/upgrade_check.py --store sqlite --old-image ghcr.io/nick-lennox/trailbeam:0.3.0 \
            --new-image "tbci-${{ github.run_id }}-${{ github.run_attempt }}-upgrade:ci"
      - name: Remove this job's image
        if: always() && matrix.store == 'sqlite-image'
        run: docker image rm -f "$TB_IMAGE" || true

  backup-restore:
    # A backup taken with the README's commands while the server ingests restores onto a new machine, with its
    # token and receipt-hash key. python/smoke/backup_restore_check.py says what is checked.
    name: Backup and restore under load (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, sqlite-image, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432   # random host port: several runners share one machine
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,postgres]'
      - name: SQLite, trailbeam start's data directory
        if: matrix.store == 'sqlite'
        run: python smoke/backup_restore_check.py --store sqlite --cmd trailbeam
      - name: SQLite in a Docker volume, this checkout's image
        if: matrix.store == 'sqlite-image'
        run: |
          echo "TB_IMAGE=tbci-${{ github.run_id }}-${{ github.run_attempt }}-backup:ci" >> "$GITHUB_ENV"
          docker build -t "tbci-${{ github.run_id }}-${{ github.run_attempt }}-backup:ci" ..
          python smoke/backup_restore_check.py --store sqlite --image "tbci-${{ github.run_id }}-${{ github.run_attempt }}-backup:ci"
      # The runner's default pg_dump/pg_restore can be newer than the server (18 on Postgres 16); a newer
      # pg_restore sends settings an older server rejects (transaction_timeout), so use the server's major version.
      # Ubuntu's own archive carries only its default major version; postgresql-client-16 comes from the
      # PostgreSQL apt repository (apt.postgresql.org), added with postgresql-common's script.
      - name: Postgres client tools of the server's major version
        if: matrix.store == 'postgres'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Postgres, pg_dump and pg_restore (client 16, server 16)
        if: matrix.store == 'postgres'
        run: >-
          python smoke/backup_restore_check.py --store postgres --cmd trailbeam
          --pg-bin /usr/lib/postgresql/16/bin
          --pg-url "postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
      - name: Remove this job's image
        if: always() && matrix.store == 'sqlite-image'
        run: docker image rm -f "$TB_IMAGE" || true

  demo:
    name: Local demo (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TB_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "TB_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: Build and start the demo (images local only, not pushed)
        run: COMPOSE_PROJECT_NAME="$TB_NAME" TRAILBEAM_DEMO_PORT="$TB_PORT" docker compose -f demo/compose.yaml up -d --build --wait
      - name: Timelines from the Python and Node.js consumers reach Trailbeam
        run: python3 demo/smoke_test.py "http://127.0.0.1:$TB_PORT" --timeout 180
      - name: Logs
        if: always()
        run: COMPOSE_PROJECT_NAME="$TB_NAME" docker compose -f demo/compose.yaml logs --tail 50 || true
      - name: Stop
        if: always()
        run: COMPOSE_PROJECT_NAME="$TB_NAME" docker compose -f demo/compose.yaml down -v --remove-orphans || true

  examples:
    # Every example in examples/ against ElasticMQ and a Trailbeam built from this commit: one order deleted,
    # one retried after the visibility timeout, one moved to the dead-letter queue (examples/check.py).
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [python-boto3, python-lambda, node-sdk-v3, node-lambda]
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TRAILBEAM_EXAMPLE_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-example-${{ matrix.example }}" >> "$GITHUB_ENV"
      - name: Run the example, check its spans arrived, remove it (images local only, not pushed)
        run: examples/run.sh ${{ matrix.example }}

  team-install:
    # docker-compose.yaml (QV-145): a clean start from .env.example, one span with the token, and the data
    # still there after docker compose down && up.
    name: Team install (Docker Compose, Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TB_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: .env from .env.example, with new secrets
        run: |
          token=$(openssl rand -hex 32); echo "::add-mask::$token"; echo "TRAILBEAM_TOKEN=$token" >> "$GITHUB_ENV"
          sed -e "s/^TRAILBEAM_TOKEN=.*/TRAILBEAM_TOKEN=$token/" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^TRAILBEAM_RECEIPT_HASH_KEY=.*/TRAILBEAM_RECEIPT_HASH_KEY=$(openssl rand -hex 32)/" \
              -e "s/^TRAILBEAM_BIND=.*/TRAILBEAM_BIND=127.0.0.1/" -e "s/^TRAILBEAM_PORT=.*/TRAILBEAM_PORT=$TB_PORT/" \
              .env.example > .env
      - name: Build and start (image local only, not pushed)
        run: docker compose up -d --build --wait
      - name: Send one span with the token, read its timeline
        run: python3 python/smoke/team_check.py "http://127.0.0.1:$TB_PORT" send team-check-1
      - name: The span is in Postgres, with the lock setting
        run: |
          test "$(docker compose exec -T postgres psql -U trailbeam -tAc "SELECT count(*) FROM spans WHERE mid = 'team-check-1'")" = 1
          test "$(docker compose exec -T postgres psql -U trailbeam -tAc 'SHOW max_locks_per_transaction')" = 256
      - name: docker compose down && up keeps the data
        run: |
          docker compose down
          docker compose up -d --wait
          python3 python/smoke/team_check.py "http://127.0.0.1:$TB_PORT" check team-check-1
      - name: Logs
        if: always()
        run: docker compose logs --tail 50 || true
      - name: Remove this job's containers, volumes and image
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker image rm -f "$COMPOSE_PROJECT_NAME-trailbeam:local" || true

  kubernetes:
    # The Helm chart (deploy/helm, QV-173) on a kind cluster of its own: lint, install with the trial Postgres,
    # one span with the token through the Service, an upgrade that keeps the token (deploy/helm/check.sh).
    name: Kubernetes (Helm chart on kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Names of its own (runners share one machine)
        run: |
          echo "TB_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-k8s" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: kind, kubectl and helm (pinned, checksums checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz
          sha256sum -c - <<'SUMS'
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind
          c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  kubectl
          d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983  helm.tgz
          SUMS
          tar xzf helm.tgz --strip-components=1 linux-amd64/helm && rm helm.tgz
          chmod +x kind kubectl helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the image with the Postgres driver (local only, not pushed)
        run: docker build --build-arg TRAILBEAM_EXTRAS=server,postgres -t "$TB_NAME:ci" .
      - name: Create the kind cluster
        # The node image is kept on the machine between runs (about 1.3 GB), so a run doesn't download it again.
        run: kind create cluster --name "$TB_NAME" --wait 120s --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Install the chart, send one span, upgrade
        run: deploy/helm/check.sh "$TB_NAME" "$TB_NAME:ci"
      - name: Cluster state and logs
        if: failure()
        run: |
          kubectl get all,pvc,secret -o wide || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/instance=trailbeam --all-containers --tail 80 --prefix || true
      - name: Remove this job's cluster and image
        if: always()
        run: |
          kind delete cluster --name "$TB_NAME" || true
          docker image rm -f "$TB_NAME:ci" || true

  concurrency-check:
    name: Concurrency check (3 processes x 4 consumers, 200 messages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TRAILBEAM_DEMO_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Checker unit tests
        run: pytest -q demo/check/tests
      # The 0.1 check on the emulator: 200 of 200 complete, in order (no effect shown before its cause),
      # joined, with the right receive counts and deleted, in each language (demo/README.md#concurrency-check).
      # It fails the build. The resolved shares per kind and source, and the 90% floor's result, are
      # reported in the job summary, but on the emulator check.sh doesn't gate on the floor (as locally);
      # it gates in concurrency-check-aws: ElasticMQ stamps SentTimestamp and
      # ApproximateFirstReceiveTimestamp in the same millisecond, so send->receive stays concurrent here
      # for a reason that is the emulator's, not Trailbeam's (demo/README.md#the-floor-in-ci).
      # --dlq: a poison message every 20 goes to the dead-letter queue; each move must be observed
      # (DeadLetterQueueSourceArn), none inferred. Emulator only: not approved on real SQS yet (QV-33).
      - name: Python
        id: python
        run: demo/check.sh --dlq python 200
      - name: Node.js
        id: node
        if: success() || steps.python.conclusion == 'failure'
        run: demo/check.sh --dlq node 200
      - name: Summary
        if: always()
        run: |
          {
            echo "### Concurrency check: python ${{ steps.python.outcome }}, node ${{ steps.node.outcome }}"
            for f in demo/results/*.txt; do echo; echo "\`$f\`"; echo '```'; cat "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-check-results
          path: demo/results/
      # check.sh leaves the stack up for local reruns; on a runner it would pile up and use up Docker's networks
      - name: Tear down
        if: always()
        run: docker compose -f demo/compose.yaml down -v --remove-orphans || true

  concurrency-check-aws:
    # The same check against real SQS in us-east-1, with the 90% floor gating (demo/README.md#the-floor-in-ci).
    # Needs the repository secrets QV2_AWS_ACCESS_KEY_ID and QV2_AWS_SECRET_ACCESS_KEY (an IAM user limited
    # to sqs:* on qv2-measure-*). It fails, rather than skips, when they are missing, so the floor can't stop
    # gating unnoticed. Pull requests from forks get no secrets, so it runs on pushes and same-repo PRs only.
    name: Concurrency check on real SQS (floor gating)
    # Real AWS calls, the slowest job and timing-sensitive: main only. PRs get the emulator check above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: real-sqs
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.QV2_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.QV2_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Pick a free port and names of its own (runners share one machine)
        run: |
          echo "TRAILBEAM_DEMO_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=tbci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_ENV"
      - name: The AWS secrets are set
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Repository secrets QV2_AWS_ACCESS_KEY_ID and QV2_AWS_SECRET_ACCESS_KEY are not set; the send->receive floor can't be checked."
            exit 1
          fi
      # Queues are qv2-measure-<run> and qv2-measure-<run>-dlq, deleted when each run ends.
      - name: Python
        id: python
        run: demo/check.sh --aws python 200
      - name: Node.js
        id: node
        if: success() || steps.python.conclusion == 'failure'
        run: demo/check.sh --aws node 200
      - name: Summary
        if: always()
        run: |
          {
            echo "### Concurrency check on real SQS: python ${{ steps.python.outcome }}, node ${{ steps.node.outcome }}"
            for f in demo/results/*.txt; do echo; echo "\`$f\`"; echo '```'; cat "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-check-aws-results
          path: demo/results/
      # check.sh leaves the stack up for local reruns; on a runner it would pile up and use up Docker's networks
      - name: Tear down
        if: always()
        run: docker compose -f demo/compose.yaml down -v --remove-orphans || true

  monitoring:
    # The Datadog Agent check, Prometheus configuration, alert rules and Grafana dashboard in deploy/monitoring
    # (QV-304), against real tools: the Agent's OpenMetrics check in a dry run (no Datadog account or key), promtool
    # and a real Prometheus scrape (deploy/monitoring/check.sh).
    name: Monitoring (Datadog Agent, Prometheus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'python[server]'
      - run: deploy/monitoring/check.sh
