name: Release

# Push a tag vX.Y.Z (matching python/pyproject.toml, trailbeam.__version__, node/package.json, the Helm chart's
# version and appVersion in deploy/helm/trailbeam/Chart.yaml and a "## X.Y.Z" heading in CHANGELOG.md) to publish
# that version:
#   - PyPI: trailbeam (wheel with the built UI, and sdist), by trusted publishing (no token stored)
#   - npm: trailbeam (the Node.js package), with provenance, using the NPM_TOKEN secret
#   - GitHub Container Registry: ghcr.io/nick-lennox/trailbeam:X.Y.Z and :latest (SQLite only), and
#     :X.Y.Z-postgres and :latest-postgres (with the Postgres driver; the Helm chart's default image).
#     Once per version: the job stops before pushing either image if :X.Y.Z is already published
#   - a GitHub release with that version's CHANGELOG section
# Nothing is published unless the full CI (every job of ci.yml, the nightly set, called with full: true) passes
# on the tagged commit (QV-389).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches every package version and the changelog
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" python/pyproject.toml || { echo "python/pyproject.toml is not $v"; exit 1; }
          grep -qx "__version__ = \"$v\"" python/src/trailbeam/__init__.py || { echo "trailbeam.__version__ is not $v"; exit 1; }
          test "$(node -p 'require("./node/package.json").version')" = "$v" || { echo "node/package.json is not $v"; exit 1; }
          grep -qx "version: $v" deploy/helm/trailbeam/Chart.yaml || { echo "Chart.yaml version is not $v"; exit 1; }
          grep -qx "appVersion: \"$v\"" deploy/helm/trailbeam/Chart.yaml || { echo "Chart.yaml appVersion is not $v"; exit 1; }
          grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  ci:
    # Every CI job on the tagged commit, whatever changed: the core, every path-filtered job, and the nightly
    # tier (upgrade, backup and restore, perf, monitoring, real SQS, docs commands).
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit

  python:
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the web screen into the Python package
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the wheel and sdist
        working-directory: python
        run: |
          pip install build
          python -m build -o ../dist .
          python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('../dist/*.whl')[0]).namelist(); sys.exit(0 if 'trailbeam/server/ui/index.html' in n else 'the wheel has no web screen')"
      - uses: actions/upload-artifact@v4
        with: { name: python-dist, path: dist/ }

  pypi:
    needs: [python, ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: python-dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write  # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - working-directory: node
        run: npm ci --no-audit --no-fund && npm test
      - working-directory: node
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version tags are write-once: npm X.Y.Z runs ghcr.io/nick-lennox/trailbeam:X.Y.Z, so pushing that tag
      # again (a re-run of this job, or a stolen token) would change what an already-published npm version runs.
      # Only "not found" lets the push go ahead; any other answer (auth, network) stops it too.
      - name: Refuse to replace an image version that is already published
        run: |
          ref="ghcr.io/nick-lennox/trailbeam:${{ needs.check.outputs.version }}"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::error::$ref is already published; version tags are never pushed twice. Release a new version."
            exit 1
          fi
          case "$out" in
            *"not found"*|*"manifest unknown"*|*MANIFEST_UNKNOWN*) echo "$ref is not published yet" ;;
            *) echo "::error::can't tell whether $ref is already published: $out"; exit 1 ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nick-lennox/trailbeam:${{ needs.check.outputs.version }}
            ghcr.io/nick-lennox/trailbeam:latest
      - name: The image with the Postgres driver (the Helm chart's default)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TRAILBEAM_EXTRAS=server,postgres
          tags: |
            ghcr.io/nick-lennox/trailbeam:${{ needs.check.outputs.version }}-postgres
            ghcr.io/nick-lennox/trailbeam:latest-postgres

  github-release:
    needs: [check, pypi, npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          v="${{ needs.check.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Trailbeam $v" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
