# Docs commands (QV-274): run the marked commands and samples in README.md, and on the docs pages of
# docs.trailbeam.app, against Trailbeam built from this commit. Fails when the README or a page tells
# readers to do something that doesn't work, or names a flag, TRAILBEAM_* variable or endpoint this
# commit doesn't have. How to mark a block: scripts/doc-snippets/README.md in nick-lennox/trailbeam-app.
#
# The runner and the docs pages are in nick-lennox/trailbeam-app, which is private. This job reads its
# main with a read-only deploy key ("trailbeam CI: docs commands" there), whose private half is the
# DOCS_DEPLOY_KEY secret here. Pull requests from forks get no secrets, so for them the job says so and
# does nothing.
#
# ci.yml calls this workflow (QV-389): on pull requests and pushes that change a README or .env.example, and
# in the nightly full run, which catches docs pages changed in trailbeam-app since the last Trailbeam change.
name: Docs commands

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: README and docs pages commands
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The deploy key for trailbeam-app is there
        id: key
        env:
          KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$KEY" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = true ]; then echo "::notice::A pull request from a fork gets no DOCS_DEPLOY_KEY, so the docs commands are not run."
          else echo "::error::The DOCS_DEPLOY_KEY secret is not set (see the top of .github/workflows/docs.yml)."; exit 1; fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.run

      - uses: actions/checkout@v4
        if: steps.key.outputs.run
        with:
          repository: nick-lennox/trailbeam-app
          ref: main
          path: _docs
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          sparse-checkout: |
            scripts/doc-snippets
            content/docs

      - uses: actions/setup-python@v5
        if: steps.key.outputs.run
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.run
        with:
          node-version: "22"

      # public.ecr.aws limits anonymous pulls per IP address, and GitHub's runners share addresses, so a pull can
      # fail with "Data limit exceeded" for reasons that are not the page's (QV-313's PR #86, twice). Pull the
      # pages' public ECR images first, with retries, and if ECR still refuses, take the same image from Docker
      # Hub (aws-observability publishes each one as amazon/<name>, same digest) and tag it with the page's name,
      # so the page's own `docker run` finds it locally.
      - name: Pull the docs pages' public ECR images (Docker Hub copy if ECR refuses)
        if: steps.key.outputs.run
        run: |
          for ref in $(grep -rhoE 'public\.ecr\.aws/[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+' _docs/content/docs README.md | sort -u); do
            ok=
            for i in 1 2 3; do docker pull -q "$ref" && { ok=1; break; }; sleep $((i * 15)); done
            [ -n "$ok" ] && continue
            case "$ref" in
              public.ecr.aws/aws-observability/*) mirror="amazon/${ref#public.ecr.aws/aws-observability/}" ;;
              *) echo "::error::can't pull $ref from public ECR and know no Docker Hub copy of it"; exit 1 ;;
            esac
            docker pull -q "$mirror"
            want=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
            got=$(docker buildx imagetools inspect "$mirror" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
            if [ -n "$want" ] && [ "$want" != "$got" ]; then echo "::error::$mirror ($got) is not $ref ($want)"; exit 1; fi
            docker tag "$mirror" "$ref"
            echo "::warning::public ECR refused $ref; used the Docker Hub copy $mirror${want:+ (same digest $want)}"
          done

      - name: Build Trailbeam (wheelhouse, Node.js package, image)
        if: steps.key.outputs.run
        run: _docs/scripts/doc-snippets/prepare.sh . "$RUNNER_TEMP/doc-test"

      - name: README names only flags, variables and endpoints this commit has
        if: steps.key.outputs.run
        run: node _docs/scripts/doc-snippets/check-names.mjs --artifacts "$RUNNER_TEMP/doc-test" README.md

      - name: Docs pages name only flags, variables and endpoints this commit has
        if: steps.key.outputs.run && (success() || failure())
        run: node _docs/scripts/doc-snippets/check-names.mjs --artifacts "$RUNNER_TEMP/doc-test"

      - name: Run the README's commands
        if: steps.key.outputs.run && (success() || failure())
        run: node _docs/scripts/doc-snippets/run.mjs --artifacts "$RUNNER_TEMP/doc-test" --out "$RUNNER_TEMP/doc-test/runs" README.md

      - name: Run the docs pages' commands
        if: steps.key.outputs.run && (success() || failure())
        run: node _docs/scripts/doc-snippets/run.mjs --artifacts "$RUNNER_TEMP/doc-test" --out "$RUNNER_TEMP/doc-test/runs"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.run && failure()
        with:
          name: docs-commands-logs
          path: ${{ runner.temp }}/doc-test/runs/*.log
