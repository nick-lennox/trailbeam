[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qv2"
version = "0.1.0.dev0"
description = "Message-level timelines for Amazon SQS: OpenTelemetry hooks for boto3 and AWS Lambda."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-botocore>=0.48b0",
    "botocore>=1.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "boto3>=1.34",
    # Local SQS emulator for the hook tests (in-process server). No AWS account is used.
    "moto[server]>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
