[build-system]
requires = ["setuptools>=77"]  # 77: license and license-files as PEP 639 has them
build-backend = "setuptools.build_meta"

[project]
name = "trailbeam"
version = "0.4.0"
description = "Message-level timelines for Amazon SQS and RabbitMQ: OpenTelemetry hooks for boto3, AWS Lambda and pika. The server extra adds Trailbeam itself (trailbeam-server)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-botocore>=0.49b0",
    "botocore>=1.34",
]

[project.optional-dependencies]
# RabbitMQ (contract/span-contract-amqp.md): the pika hooks, trailbeam.pika. pip install "trailbeam[pika]".
pika = [
    "pika>=1.3",
]
# Trailbeam itself is its own distribution, trailbeam-server (../server), at the same version as this one. These
# extras pull it in, so the install commands from before 0.5.0 still work:
#   pip install "trailbeam[server]", then run: trailbeam
server = [
    "trailbeam-server==0.4.0",
]
# Postgres instead of SQLite (TRAILBEAM_STORE_URL=postgres://...): pip install "trailbeam[server,postgres]".
postgres = [
    "trailbeam-server[postgres]==0.4.0",
]
# Single sign-on with OpenID Connect (--oidc-issuer): pip install "trailbeam[server,sso]".
sso = [
    "trailbeam-server[sso]==0.4.0",
]
test = [
    "opentelemetry-proto>=1.28",
    "tomli>=1.1; python_version < '3.11'",
    "pytest>=8",
    "boto3>=1.34",
    # Local SQS emulator for the hook tests (in-process server). No AWS account is used.
    "moto[server]>=5",
    # contract/openapi.yaml against the server (tests/server/test_openapi.py, openapi_contract.py)
    "pyyaml>=6",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
    # single sign-on against an in-process identity provider (tests/server/test_oidc.py)
    "PyJWT[crypto]>=2.8",
    # the RabbitMQ hooks (tests/test_pika_*.py; the broker tests need TRAILBEAM_TEST_AMQP_URL)
    "pika>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
