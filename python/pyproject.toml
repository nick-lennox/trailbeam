[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailbeam"
version = "0.1.0.dev0"
description = "Message-level timelines for Amazon SQS: OpenTelemetry hooks for boto3 and AWS Lambda, and, with the server extra, Trailbeam itself."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-botocore>=0.48b0",
    "botocore>=1.34",
]

[project.optional-dependencies]
# Trailbeam itself: receives spans over OTLP/HTTP, keeps them in SQLite, serves the API and web screen.
# pip install "trailbeam[server]", then run: trailbeam
server = [
    "opentelemetry-proto>=1.27",
]
test = [
    "opentelemetry-proto>=1.27",
    "pytest>=8",
    "boto3>=1.34",
    # Local SQS emulator for the hook tests (in-process server). No AWS account is used.
    "moto[server]>=5",
]

[project.scripts]
trailbeam = "trailbeam.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
