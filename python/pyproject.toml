[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailbeam"
version = "0.2.0"
description = "Message-level timelines for Amazon SQS: OpenTelemetry hooks for boto3 and AWS Lambda, and, with the server extra, Trailbeam itself."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-botocore>=0.48b0",
    "botocore>=1.34",
]

[project.optional-dependencies]
# Trailbeam itself: receives spans over OTLP/HTTP, keeps them in SQLite, serves the API and web screen.
# pip install "trailbeam[server]", then run: trailbeam
server = [
    "opentelemetry-proto>=1.27",
    "tomli>=1.1; python_version < '3.11'",  # the config file; tomllib from 3.11
]
# Postgres instead of SQLite (TRAILBEAM_STORE_URL=postgres://...): pip install "trailbeam[server,postgres]".
# Imported only when the store URL is a Postgres one, so a SQLite install doesn't need it.
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
test = [
    "opentelemetry-proto>=1.27",
    "tomli>=1.1; python_version < '3.11'",
    "pytest>=8",
    "boto3>=1.34",
    # Local SQS emulator for the hook tests (in-process server). No AWS account is used.
    "moto[server]>=5",
    # contract/openapi.yaml against the server (tests/server/test_openapi.py, openapi_contract.py)
    "pyyaml>=6",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
trailbeam = "trailbeam.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The shared UI's shell, when it has been built (npm run build in ui/). Without it, Trailbeam serves its
# server-rendered pages only.
[tool.setuptools.package-data]
"trailbeam.server" = ["ui/*.html", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
