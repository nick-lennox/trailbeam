  /api/timeline-events:
    get:
      operationId: list-timeline-events
      x-example-request: /api/timeline-events?from_ms=1794852337380&to_ms=1794852337386&limit=5
      tags: [Events]
      summary: List the Event explorer's events, inferred ones included
      description: |
        Returns what happened to the messages active in a time window, one event per thing that
        happened, newest first, made from each message's timeline. Unlike `GET /api/events`, this
        includes what a timeline infers: an expired visibility timeout, a move to the dead-letter
        queue, the Lambda trigger's delete after a successful handler, and a Lambda invocation that
        never reported an outcome. This is what the Event explorer lists, here and in the hosted app.

        The events are made by the same rules as `eventsOfTimeline` in `@trailbeam/ui`, so the field
        names are that function's, in camelCase. A field an event has no value for is left out.

        The messages read are those with a stored span in the window, or up to the Lambda timeout
        before it, most recently active first, at most `limit` of them. Only their events in the
        window, both ends included, are returned. A message's stored body (contract section 15) is
        on the event whose span carried it, for queues the server stores bodies for.

        The window is `from_ms` to `to_ms`, both included. Without them it is the last `since_s`
        seconds, by default a day.
      parameters:
