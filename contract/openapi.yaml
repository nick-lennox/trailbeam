                  sent: 2
                  share: 0.2857142857142857
                  p95_in_queue_ms: 512
                  first_deliveries: 2
                  dead_lettered: 0
                - tenant: hooli
                  sent: 0
                  share: 0.0
                  p95_in_queue_ms: 2
                  first_deliveries: 1
