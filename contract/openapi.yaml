# The Trailbeam server's HTTP interface: the read-only API under /api/ and the ingest endpoint.
#
# Written from server/src/trailbeam/server/server.py. The server is a plain http.server handler, so this
# file is not generated: when a route, a parameter or a response field changes there, change it here in
# the same commit. docs.trailbeam.app builds its API reference from this file.
# python/tests/server/test_openapi.py fails when the two disagree: routes, query parameters and their
# bounds and defaults, and every response the server tests produce, validated against this file.
#
# x-example-request, on an operation, is the request that returned the operation's 200 example, from a
# server holding contract/fixtures/contract-3.2-spans.json.
openapi: 3.1.0
info:
  title: Trailbeam server
  version: 0.1.0.dev0
  summary: The read-only JSON API and the OTLP ingest endpoint of the open-source Trailbeam server.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    One port serves the ingest endpoint (`POST /v1/traces`), the API (`GET /api/...`) and the web UI.
    The default port is `4318`.

    Every API endpoint returns `application/json`. The message, problem, tenant and server endpoints are
    `GET`s that never change stored data. The people and token endpoints (tags People and Tokens, added
    in 0.5) also take `POST`, `PATCH` and `DELETE`. Those must send their body as `application/json`,
    and a browser page of another site can't call them (`Sec-Fetch-Site` and `Origin` are checked).

    A query parameter the endpoint does not list is ignored. When a parameter is repeated, the last value
    is used.

    **Access.** Which credentials work depends on whether the server has an admin account. Each
    replica checks this in the store at least every 5 seconds, so all replicas switch over within seconds
    of the first admin being created.

    - No admin yet: with `TRAILBEAM_TOKEN` set, the API needs it (`Authorization: Bearer` or
      `x-trailbeam-key`) or the `trailbeam_session` cookie the login page sets. Without it, every
      request is served.
    - Once an admin exists: the API needs a person, an admin or a member. That means a personal API
      token (`Authorization: Bearer tbp_...`) or a sign-in session (the `trailbeam_sid` cookie, or
      `__Host-trailbeam_sid` over HTTPS), from an email and password or from single sign-on. `TRAILBEAM_TOKEN` then works only for ingest and
      `/metrics`, and the `trailbeam_session` cookie no longer works.

    Ingest is separate: see `POST /v1/traces`. `/api/ready` and the short form of `/api/health` never
    need a credential.

    Accounts are a preview: the server ignores them unless it runs with `--accounts`
    (`TRAILBEAM_ACCOUNTS=1`). Off, the rules without an admin apply, whatever the store holds, and
    `/api/users`, `/api/tokens/ingest` and `/api/me/tokens` behave as on a store without accounts.

    **People and tokens.** The first admin is made with `trailbeam users create --role admin`, with
    `TRAILBEAM_ADMIN_EMAIL` and `TRAILBEAM_ADMIN_PASSWORD_FILE`, or with the one-time link
    `trailbeam start` prints (`/setup#code=...`). After that, admins manage people and ingest tokens with
    `/api/users` and `/api/tokens/ingest` (the web screen's People and Tokens pages) or with
    `trailbeam users` and `trailbeam tokens`. Anyone signed in manages their own personal API tokens
    with `/api/me/tokens`. Two roles: `admin` and `member`. `/setup`, `/set-password` (where an invite or
    reset link leads), `/login` and `/logout` are web pages, not part of this API.

    **Single sign-on** (OpenID Connect, with `--oidc-issuer` and `--public-url`) adds two more web pages:
    `/login/oidc` sends the browser to the identity provider, and `/login/oidc/callback` is where the
    provider sends it back (the redirect URI to register there). They start the same sign-in session as a
    password does, and are not part of this API either.

    **Sign in with GitHub** (with `--github-client-id` and `--public-url`) adds two web pages of the same
    kind: `/login/github` sends the browser to GitHub, and `/login/github/callback` is where GitHub sends
    it back (the OAuth app's callback URL). They start the same sign-in session too.

    **Passkeys** (WebAuthn, with `--public-url` and `pip install "trailbeam[server,passkeys]"`): the sign-in
    page's Sign in with a passkey posts JSON to `/login/passkey/options` for a challenge and to `/login/passkey`
    with the signed answer, which starts the same session. They are part of the sign-in page, not of this API.
    Anyone signed in adds and removes their own passkeys with `/api/me/passkeys`.
servers:
  - url: http://127.0.0.1:4318
    description: A Trailbeam server started with its defaults.
tags:
  - name: Messages
    description: One message's timeline and body, and the list of recent messages.
  - name: Problems
    description: Messages delivered more than once, and messages with no final delete.
  - name: Events
    description: The recorded steps of every message in a time window, the events the Event explorer lists (inferred ones included), and their counts over time.
  - name: Tenants
    description: Per-tenant counts and tenant name search.
  - name: Queues
    description: Flows between services and queues, and one queue's figures per time bucket.
  - name: Server
    description: Liveness, readiness and counts for the server itself.
  - name: People
    description: Who can sign in, and their role. Admins only.
  - name: Tokens
    description: Ingest tokens (admins only) and your own personal API tokens.
  - name: Account
    description: Your own account. Your passkeys, which sign you in instead of a password.
  - name: Dashboards
    description: |
      Dashboards, their widgets, and what each widget draws over a time range (the hosted app's dashboards). A
      preview: answered only while `TRAILBEAM_DASHBOARDS` is on (1, true, yes or on); off, every route is a `404`.
  - name: Settings
    description: |
      The server's settings. Admins only (anyone, before accounts exist).
  - name: Ingest
    description: Where the packages and the OpenTelemetry Collector send spans. Not part of the API.
security:
  - {}
  - accessToken: []
  - session: []
  - personalToken: []
  - signInSession: []
  - proxySignIn: []
paths:
  /api/me:
    get:
      operationId: get-me
      x-example-request: /api/me
      tags: [Server]
      summary: Show who the request is
      description: |
        Returns how the server let this request in and, for a person, who they are and their role.
        Use it to check a personal API token. Added in 0.4.
      responses:
        '200':
          description: How the request was let in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
              examples:
                open:
                  summary: A server without a token or an admin
                  value: {"auth": "off", "via": "none", "user": null, "sign_out": false}
                person:
                  summary: With a personal API token, once an admin exists
                  value: {"auth": "accounts", "via": "personal_token", "user": {"id": 2, "email": "ana@example.com", "name": "Ana", "role": "member"}, "sign_out": false}
                proxy:
                  summary: Signed in by a proxy in front of the server (`--proxy-auth-header`)
                  value: {"auth": "accounts", "via": "proxy", "user": {"id": 3, "email": "bo@example.com", "name": "bo", "role": "member"}, "sign_out": true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/users:
    get:
      operationId: list-users
      tags: [People]
      summary: List the people who can sign in
      description: |
        Every person with an account, admins and members, oldest first. Needs an admin. Added in 0.5.
      responses:
        '200':
          description: The people.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users, sends_email]
                properties:
                  users: {type: array, items: {$ref: '#/components/schemas/User'}}
                  sends_email:
                    type: boolean
                    description: |
                      The server has a mail server set up (`TRAILBEAM_SMTP_HOST`), so adding a person and making
                      a link email the link to them. Added in 0.5.
              example: {"sends_email": false, "users": [{"id": 1, "email": "ada@example.com", "name": "Ada", "role": "admin", "status": "active", "created_at_ms": 1795400000000, "last_sign_in_ms": 1795480000000, "you": true, "single_sign_on": false, "passkeys": 1}, {"id": 2, "email": "ben@example.com", "name": "Ben", "role": "member", "status": "invited", "created_at_ms": 1795410000000, "last_sign_in_ms": null, "you": false, "single_sign_on": true, "passkeys": 0}]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: add-user
      tags: [People]
      summary: Add a person and get their invite link
      description: |
        Adds a person with no password yet, and makes their one-time invite link. It lasts 7 days. With a
        mail server set up (`TRAILBEAM_SMTP_HOST`), the server emails the link to them, unless `send_email`
        is `false`; once sent, the answer leaves out `link.url`. Otherwise, or when sending fails, the answer
        has the link: give it to them privately, since whoever opens it chooses the password. `name` defaults
        to the part of the email before `@`, and `role` to `member`. Needs an admin. Added in 0.5.

        `link.url` is only ever in the answer to someone signed in in a browser. With a personal API token or
        a sign-in through the proxy the person is still added and emailed, but the answer leaves out
        `link.url`: whoever opens the link is signed in and could add a passkey that outlives the token.
        Make a link from the People page instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
                name: {type: string, maxLength: 200}
                role: {type: string, enum: [admin, member], default: member}
                send_email: {$ref: '#/components/schemas/SendEmail'}
            example: {"email": "ben@example.com", "name": "Ben", "role": "member"}
      responses:
        '201':
          description: The person, and their invite link.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithLink'}
              example: {"user": {"id": 2, "email": "ben@example.com", "name": "Ben", "role": "member", "status": "invited", "created_at_ms": 1795410000000, "last_sign_in_ms": null, "you": false, "single_sign_on": false, "passkeys": 0}, "link": {"kind": "invite", "url": "http://127.0.0.1:4318/set-password#code=8bV1q0Jm0h6rWw2y7mM5c3xQKk0p0b2N7Hn8yZtq1sE", "expires_at_ms": 1796014800000}, "email": null}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/users/{user_id}:
    patch:
      operationId: change-user
      x-example-request: /api/users/2
      tags: [People]
      summary: Change a person's role, or disable them
      description: |
        Changes `role`, `disabled`, or both. A new role or disabling ends the person's sessions, so they
        sign in again; other replicas see it within 20 seconds. The last admin who can sign in can't be
        made a member or disabled: that is a `409` with `reason` `last_admin`. Needs an admin. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string, enum: [admin, member]}
                disabled: {type: boolean}
            example: {"role": "admin"}
      responses:
        '200':
          description: The person, changed.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
    delete:
      operationId: remove-user
      x-example-request: /api/users/2
      tags: [People]
      summary: Remove a person
      description: |
        Removes the person with their sessions, personal API tokens, passkeys and links. The last admin who can sign
        in can't be removed (`409`, `reason` `last_admin`). Needs an admin. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200':
          description: Removed.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: object
                    additionalProperties: false
                    required: [id, email]
                    properties: {id: {type: integer}, email: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/users/{user_id}/link:
    post:
      operationId: make-user-link
      x-example-request: /api/users/2/link
      tags: [People]
      summary: Make a new invite or password reset link
      description: |
        A new one-time link for the person: an invite (`kind` `invite`, 7 days) if they have no password
        yet, else a password reset (`kind` `reset`, 24 hours). It replaces their earlier link. Opening it
        and choosing a password ends their other sessions and removes their passkeys. A disabled person
        gets a `409`. With a mail server set up, the link is emailed to them as when adding a person
        (`send_email`). Send `{}` as the body. Needs an admin. Added in 0.5.

        With a personal API token or a sign-in through the proxy, the link can only be emailed: the answer
        leaves out `link.url`, and a request that wouldn't email it (no mail server, or `send_email`
        `false`) gets `403` (`reason` `needs_a_session`), with the person's earlier link kept. Whoever
        opens a link is signed in and could add a passkey that outlives the token.
      parameters: [{$ref: '#/components/parameters/user_id'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                send_email: {$ref: '#/components/schemas/SendEmail'}
            example: {}
      responses:
        '201':
          description: The person, and the link.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithLink'}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/users/{user_id}/passkeys:
    get:
      operationId: list-user-passkeys
      x-example-request: /api/users/2/passkeys
      tags: [People]
      summary: List a person's passkeys
      description: |
        The passkeys that can sign the person in, as their own Account page lists them, so an admin can see
        one the person didn't add. `on` says whether this server has passkeys on. Needs an admin. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200':
          description: Their passkeys, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkeys, 'on']
                properties:
                  passkeys: {type: array, items: {$ref: '#/components/schemas/Passkey'}}
                  'on': {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: remove-user-passkeys
      x-example-request: /api/users/2/passkeys
      tags: [People]
      summary: Remove all of a person's passkeys
      description: |
        None of them can sign the person in any more. Their sessions stay: a password reset link
        (`POST /api/users/{user_id}/link`) ends those and removes the passkeys too, once the person uses it.
        `passkeys` says how many were removed. Needs an admin. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/user_id'}]
      responses:
        '200':
          description: Removed.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: object
                    additionalProperties: false
                    required: [id, passkeys]
                    properties: {id: {type: integer}, passkeys: {type: integer, minimum: 0}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/tokens/ingest:
    get:
      operationId: list-ingest-tokens
      tags: [Tokens]
      summary: List the ingest tokens
      description: |
        Every ingest token, revoked ones included, and whether the legacy shared token (`TRAILBEAM_TOKEN`)
        is set. Never a token itself: only its first 8 characters. `ingest` says whether sending spans
        needs a token now. Needs an admin. Added in 0.5.
      responses:
        '200':
          description: The ingest tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens, shared_token, ingest]
                properties:
                  tokens: {type: array, items: {$ref: '#/components/schemas/IngestToken'}}
                  shared_token:
                    type: object
                    additionalProperties: false
                    required: [set, label, works_for]
                    properties:
                      set: {type: boolean, description: '`TRAILBEAM_TOKEN` (or `--token-file`) is set on this replica.'}
                      label: {type: string, const: legacy shared token (from TRAILBEAM_TOKEN)}
                      works_for: {type: array, items: {type: string, enum: [ingest, metrics]}}
                  ingest: {type: string, enum: [token, open]}
              example: {"tokens": [{"id": 1, "name": "orders-worker", "prefix": "tbi_x7Kp", "status": "active", "created_at_ms": 1795400000000, "created_by": "ada@example.com", "last_used_ms": 1795480000000, "revoked_at_ms": null}], "shared_token": {"set": true, "label": "legacy shared token (from TRAILBEAM_TOKEN)", "works_for": ["ingest", "metrics"]}, "ingest": "token"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: create-ingest-token
      tags: [Tokens]
      summary: Create an ingest token
      description: |
        A new ingest token for a service. `secret` is the token, shown only in this answer. It can only send
        spans. On a server without `TRAILBEAM_TOKEN` and with no ingest token yet, ingest is open, and the
        first token closes it: that needs `"close_open_ingest": true`, else the answer is a `409` with
        `reason` `closes_open_ingest`. Needs an admin. Added in 0.5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                close_open_ingest: {type: boolean, default: false}
            example: {"name": "orders-worker"}
      responses:
        '201':
          description: The token.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, secret]
                properties:
                  token: {$ref: '#/components/schemas/IngestToken'}
                  secret: {type: string, pattern: '^tbi_[A-Za-z0-9]{40}$'}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/tokens/ingest/{token_id}:
    delete:
      operationId: revoke-ingest-token
      x-example-request: /api/tokens/ingest/1
      tags: [Tokens]
      summary: Revoke an ingest token
      description: |
        This replica refuses it at once, the others within 30 seconds. It stays in the list as `revoked`.
        Needs an admin. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/token_id'}]
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/me/tokens:
    get:
      operationId: list-my-tokens
      tags: [Tokens]
      summary: List your personal API tokens
      description: |
        Your own personal API tokens, revoked and expired ones included. Needs a person (a sign-in or a
        personal API token): otherwise `403`. Added in 0.5.
      responses:
        '200':
          description: Your tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens: {type: array, items: {$ref: '#/components/schemas/PersonalToken'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: create-my-token
      tags: [Tokens]
      summary: Create a personal API token
      description: |
        A new personal API token that acts as you, with your role. `secret` is the token, shown only in this
        answer. `expires_in_days` from 1 to 3650; leave it out or send null for a token that works until it
        is revoked. Needs a person. Added in 0.5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                expires_in_days: {type: ['integer', 'null'], minimum: 1, maximum: 3650}
            example: {"name": "laptop scripts", "expires_in_days": 90}
      responses:
        '201':
          description: The token.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, secret]
                properties:
                  token: {$ref: '#/components/schemas/PersonalToken'}
                  secret: {type: string, pattern: '^tbp_[A-Za-z0-9]{40}$'}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/me/tokens/{token_id}:
    delete:
      operationId: revoke-my-token
      x-example-request: /api/me/tokens/1
      tags: [Tokens]
      summary: Revoke one of your personal API tokens
      description: |
        This replica refuses it at once, the others within 20 seconds. Only your own tokens: another
        person's is a `404`. Needs a person. Added in 0.5.
      parameters: [{$ref: '#/components/parameters/token_id'}]
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoSuchThing'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/me/passkeys:
    get:
      operationId: list-my-passkeys
      tags: [Account]
      summary: List your passkeys
      description: |
        The passkeys that can sign you in (WebAuthn: Face ID, Touch ID, Windows Hello, a phone or a security
        key). `on` says whether this server has passkeys on: they need `--public-url` (`TRAILBEAM_PUBLIC_URL`)
        and `pip install "trailbeam[server,passkeys]"`. With them off the list still answers, and the passkeys
        in it can't sign anyone in until they are on again. `can_add` says whether this request may add one:
        only when signed in in a browser, not with a personal API token or through the proxy. Needs a person:
        otherwise `403`. Added in 0.5.
      responses:
        '200':
          description: Your passkeys, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkeys, 'on', can_add]
                properties:
                  passkeys: {type: array, items: {$ref: '#/components/schemas/Passkey'}}
                  'on': {type: boolean}
                  can_add: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: add-my-passkey
      tags: [Account]
      summary: Add a passkey
      description: |
        Saves the passkey the browser made with `navigator.credentials.create`, from the options of
        `POST /api/me/passkeys/options`. `credential` is the browser's answer as JSON, its binary fields in
        base64url (the shape of `PublicKeyCredential.toJSON()`). The challenge in it works once, for 5 minutes.
        The passkey must check the person (user verification). `400`: the answer doesn't check out, or its
        challenge ran out or was used. `409`: passkeys are off (`reason` `passkeys_off`), or the passkey is saved
        already or you have 20, the most one person can have (`passkey_taken`). Needs a browser session: a
        personal API token or a sign-in through the proxy gets `403` (`reason` `needs_a_session`), so a token
        can't add a passkey that outlives it. Each passkey added is logged with the client's address. Added in
        0.5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential]
              properties:
                name: {type: string, maxLength: 100, description: 'What the list calls it, such as `Chrome on Mac`.'}
                credential: {type: object, description: The browser's answer to `navigator.credentials.create`.}
            example: {"name": "Chrome on Mac", "credential": {"id": "...", "rawId": "...", "type": "public-key", "response": {"clientDataJSON": "...", "attestationObject": "...", "transports": ["internal"]}}}
      responses:
        '201':
          description: The passkey, saved.
          headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkey]
                properties:
                  passkey: {$ref: '#/components/schemas/Passkey'}
        '400': {$ref: '#/components/responses/BadBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/NotJson'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/StoreUnreachable'}
  /api/me/passkeys/options:
    post:
      operationId: passkey-options
      tags: [Account]
      summary: Start adding a passkey
      description: |
        What the browser's `navigator.credentials.create` needs to make a passkey for you on this server: its
        `publicKey` options as JSON, binary fields in base64url, with a new challenge that works once, for 5
        minutes. The relying party is the host name of `--public-url`; your passkeys are left out
        (`excludeCredentials`), so an authenticator doesn't make a second one. Send `{}`. `409` while passkeys
        are off (`reason` `passkeys_off`). Needs a browser session, as adding one does (`403`, `reason`
        `needs_a_session`). Added in 0.5.
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object}
            example: {}
