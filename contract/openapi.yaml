                    type: object
                    description: '`PublicKeyCredentialCreationOptions` as JSON (`rp`, `user`, `challenge`, `pubKeyCredParams`, `authenticatorSelection` and more).'
                    required: [rp, user, challenge, pubKeyCredParams]
        '400': {$ref: '#/components/responses/BadBody'}
