      tags: [Problems]
      summary: List stuck messages grouped by cause
      description: |
        Groups the stuck messages (as `/api/stuck` lists them) by why they didn't finish: what went
        wrong on each message's latest delivery that shows a failure, for its queue and consumer. One
        group per cause, worst outcome first (dead-lettered, then stuck, then filtered), then the most
        messages. The groups have the same shape as the hosted app's, so one view reads either.

        At most `read_limit` stuck messages are read, oldest first; `capped` is true when there are
        more. `messages` lists up to `limit` of them, oldest first, each with its group's `id`, and
        `dead_letter_queues` the ones in a dead-letter queue, grouped by that queue.
      parameters:
        - name: older_than_s
          in: query
          description: The age in seconds after which a message with no final delete counts. Defaults to the server's `--stuck-after`, which defaults to 300.
          schema: {type: integer, minimum: 0, maximum: 1000000000}
        - name: from_ms
          in: query
          description: Only causes seen at or after this time, in Unix milliseconds. A message's cause is seen when its evidence was (for example the failed outcome), else when the message was first seen.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - name: to_ms
          in: query
          description: Only causes seen at or before this time, in Unix milliseconds.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - name: cause
