# The Trailbeam server's HTTP interface: the read-only API under /api/ and the ingest endpoint.
#
# Written from python/src/trailbeam/server/server.py. The server is a plain http.server handler, so this
# file is not generated: when a route, a parameter or a response field changes there, change it here in
# the same commit. docs.trailbeam.app builds its API reference from this file.
# python/tests/server/test_openapi.py fails when the two disagree: routes, query parameters and their
# bounds and defaults, and every response the server tests produce, validated against this file.
#
# x-example-request, on an operation, is the request that returned the operation's 200 example, from a
# server holding contract/fixtures/contract-3.2-spans.json.
openapi: 3.1.0
info:
  title: Trailbeam server
  version: 0.1.0.dev0
  summary: The read-only JSON API and the OTLP ingest endpoint of the open-source Trailbeam server.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    One port serves the ingest endpoint (`POST /v1/traces`), the API (`GET /api/...`) and the web UI.
    The default port is `4318`.

    Every API endpoint is a `GET` that returns `application/json`. The API never changes stored data.

    A query parameter the endpoint does not list is ignored. When a parameter is repeated, the last value
    is used.
servers:
  - url: http://127.0.0.1:4318
    description: A Trailbeam server started with its defaults.
tags:
  - name: Messages
    description: One message's timeline and body, and the list of recent messages.
  - name: Problems
    description: Messages delivered more than once, and messages with no final delete.
  - name: Tenants
    description: Per-tenant counts and tenant name search.
  - name: Server
    description: Liveness, readiness and counts for the server itself.
  - name: Ingest
    description: Where the packages and the OpenTelemetry Collector send spans. Not part of the API.
security:
  - {}
  - accessToken: []
  - session: []
paths:
  /api/messages:
    get:
      operationId: list-messages
      x-example-request: /api/messages?limit=2
      tags: [Messages]
      summary: List messages
      description: |
        Returns messages ordered by their newest span, latest first.

        With `body`, returns only messages whose stored body matches. A body search reads at most
        5,000 messages per page, in the time window given by `from_ms` and `to_ms` or by `since_s`.
        A page of a body search can hold fewer than `limit` messages and still have a `next_cursor`.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/queue'
        - name: tenant
          in: query
          description: Only messages with a span that names this tenant.
          schema: {type: string}
          example: acme
        - name: body
          in: query
          description: |
            Body search terms, separated by spaces: `body:<text>` finds text anywhere in the body, and
            `body.<path>:<value>` compares the values at a JSON path. Only bodies the server stores
            are searched. Any other term is a `400`.
          schema: {type: string}
          example: body.order.sku:A-100
        - name: from_ms
          in: query
          description: |
            Only messages whose newest span ended at or after this time, in Unix milliseconds.
            With `body`, defaults to `to_ms` minus `since_s`.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - name: to_ms
          in: query
          description: |
            Only messages whose newest span ended at or before this time, in Unix milliseconds.
            With `body`, defaults to now.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - name: since_s
          in: query
          description: With `body`, the length of the time window in seconds when `from_ms` is not given. Ignored without `body`.
          schema: {type: integer, minimum: 1, maximum: 34560000, default: 86400}
        - $ref: '#/components/parameters/lambda_timeout_s'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
              example:
                messages:
                - message_id: m-legacy
                  state: deleted
                  source_queue: orders
                  current_queue: orders
                  in_dead_letter_queue: false
                  dead_letter_queue_move: null
                  deliveries: 1
                  successful_deliveries: 1
                  consumers:
                  - service_name: legacy-svc
                    client_id: aca66402-38fd-4b18-98ed-c1406876f92b
                  first_seen: '2026-11-16T18:05:37.664000Z'
                  first_seen_clock: host
                  last_seen: '2026-11-16T18:05:37.716000Z'
                - message_id: m-bill-1
                  state: not_deleted
                  source_queue: billing
                  current_queue: billing
                  in_dead_letter_queue: false
                  dead_letter_queue_move: null
                  deliveries: 3
                  successful_deliveries: 0
                  consumers:
                  - service_name: billing-fn
                    client_id: 2b715bf1-05cc-4f28-a3d8-290faca812eb
                  first_seen: '2026-11-16T18:05:37.429000Z'
                  first_seen_clock: sqs
                  last_seen: '2026-11-16T18:05:37.528000Z'
                next_cursor: MTc5NDg1MjMzNzUyODAwMDAwMDptLWJpbGwtMQ
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/messages/{message_id}:
    get:
      operationId: get-message
      x-example-request: /api/messages/m-orders-1
      tags: [Messages]
      summary: Get a message's timeline
      description: |
        Returns everything the server stores about one SQS message ID: the recorded steps, the inferred
        steps, the proven order between them, and notices.
      parameters:
        - $ref: '#/components/parameters/message_id'
        - $ref: '#/components/parameters/lambda_timeout_s'
      responses:
        '200':
          description: The timeline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Timeline'}
              example:
                message_id: m-orders-1
                state: deleted
                source_queue: orders
                current_queue: orders
                in_dead_letter_queue: false
