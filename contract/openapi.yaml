        Returns, for each tenant with activity in a time window, the messages sent, the share of all
        sends, the 95th percentile of time in queue before the first delivery, and the messages moved
        to a dead-letter queue. Rows are ordered by `sent`, largest first.

        The window is `from_ms` to `to_ms`, both included. Without them it is the last `since_s`
