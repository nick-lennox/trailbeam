  /api/messages/{message_id}/body:
    get:
      operationId: get-message-body
      x-example-request: /api/messages/m-orders-1/body
      tags: [Messages]
      summary: Get a message's body
      description: |
        Returns the message body the server stores for the message, or the reason it stores none.
        A message has at most one stored body: the copy from the first stored send span that carried
        one, otherwise from the first stored receive span that did. The packages redact the body
        before they export it.

        The server stores and shows bodies only for the queues in its store-bodies list
        (`--store-bodies`, `TRAILBEAM_STORE_BODIES` or `store_bodies` in the configuration file). A
        queue taken off the list keeps its stored bodies, but they are no longer shown or searched.
      parameters:
        - $ref: '#/components/parameters/message_id'
      responses:
        '200':
          description: The stored body, or the reason there is none.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StoredBody'
                  - $ref: '#/components/schemas/NoBody'
                discriminator:
                  propertyName: kind
                  mapping:
                    body: '#/components/schemas/StoredBody'
                    none: '#/components/schemas/NoBody'
              examples:
                body:
                  summary: A stored body
                  value:
                    message_id: m-orders-1
                    kind: body
                    body:
                      body: '{"customer":{"id":"acme","email":"[REDACTED]"},"order":{"sku":"A-100","qty":2},"card":"[REDACTED]","password":"[REDACTED]"}'
                      format: json
                      redacted_count: 3
                      envelope: null
                      capture_status: captured
                      from_kind: send
                      service: checkout-api
                      queue: orders
                      trace_id: 004c175e11dc08356c306efbbb21258d
                      span_id: a4080bba0b0d9b30
                      time_unix_nano: '1794852336910000000'
                    size: 135
                    offloaded_size: null
                    tenant: acme
                    tenant_source: message_attribute
                none:
                  summary: No stored body
                  value:
                    message_id: m-pay-1
                    kind: none
                    reason: 'off'
                    size: 40
                    sends: 1
                    receives: 1
                    send_status: 'off'
                    receive_status: 'off'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/duplicates:
    get:
      operationId: list-duplicates
      x-example-request: /api/duplicates?limit=1
      tags: [Problems]
      summary: List duplicate deliveries
      description: |
        Returns messages that were received more than once or that succeeded more than once, ordered
        by their newest span, latest first. A delivery succeeded when SQS accepted a delete for it,
        or when its Lambda invocation reported `success`.
      parameters:
        - name: reason
          in: query
          description: Only messages with this reason. Without it, messages with either reason.
          schema:
            type: string
            enum: [received_more_than_once, succeeded_more_than_once]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/queue'
        - $ref: '#/components/parameters/version'
        - name: from_ms
          in: query
          description: Only messages whose newest span ended at or after this time, in Unix milliseconds.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - name: to_ms
          in: query
          description: Only messages whose newest span ended at or before this time, in Unix milliseconds.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - $ref: '#/components/parameters/lambda_timeout_s'
      responses:
        '200':
          description: One page of messages, each with its `reasons`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DuplicatePage'}
              example:
                messages:
                - message_id: m-bill-1
                  state: not_deleted
                  source_queue: billing
                  current_queue: billing
                  in_dead_letter_queue: false
                  dead_letter_queue_move: null
                  deliveries: 3
                  successful_deliveries: 0
                  consumers:
                  - service_name: billing-fn
                    client_id: 2b715bf1-05cc-4f28-a3d8-290faca812eb
                    service_version: null
                  first_seen: '2026-11-16T18:05:37.429000Z'
                  first_seen_clock: sqs
                  last_seen: '2026-11-16T18:05:37.528000Z'
                  reasons:
                  - received_more_than_once
                next_cursor: MTc5NDg1MjMzNzUyODAwMDAwMDptLWJpbGwtMQ
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/stuck:
    get:
      operationId: list-stuck-messages
      x-example-request: /api/stuck?limit=1
      tags: [Problems]
      summary: List stuck messages
      description: |
        Returns messages first seen more than `older_than_s` seconds ago that have no final delete,
        oldest first. A final delete is a delete SQS accepted with the receipt handle of the
        message's latest receive, or a Lambda `success` outcome for that receive.
      parameters:
        - name: older_than_s
          in: query
          description: The age in seconds after which a message with no final delete is listed. Defaults to the server's `--stuck-after`, which defaults to 300.
          schema: {type: integer, minimum: 0, maximum: 1000000000}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/queue'
        - $ref: '#/components/parameters/version'
        - name: from_ms
          in: query
          description: Only messages first seen at or after this time, in Unix milliseconds.
          schema: {type: integer, minimum: 0, maximum: 1000000000000000}
        - $ref: '#/components/parameters/lambda_timeout_s'
      responses:
        '200':
          description: One page of stuck messages, each with its age.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StuckPage'}
              example:
                older_than_s: 300
                messages:
                - message_id: m-pay-2
                  state: not_deleted
                  source_queue: payments
                  current_queue: payments-dlq
                  in_dead_letter_queue: true
                  dead_letter_queue_move: observed
                  deliveries: 3
                  successful_deliveries: 0
                  consumers:
                  - service_name: orders-worker
                    client_id: 999116e7-988b-43d2-89b1-06277f0766e4
                    service_version: null
                  first_seen: '2026-11-16T18:05:36.914000Z'
                  first_seen_clock: host
                  last_seen: '2026-11-16T18:05:37.425000Z'
                  age_s: 173861.197
                  age_across_clocks: false
                next_cursor: MTc5NDg1MjMzNjkxNDAwMDAwMDptLXBheS0y
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/events:
    get:
      operationId: list-events
      x-example-request: /api/events?from_ms=1794852336910&to_ms=1794852337716&queue=orders&limit=2
      tags: [Events]
      summary: List recorded steps
      description: |
        Returns the steps recorded in a time window, one per stored span, newest first: sends,
        receives, deletes, visibility changes and Lambda outcomes. The first page also has their
        counts per time bucket, for a histogram. This is what the Event explorer reads.

        A step is a span as it was recorded. Nothing is inferred here: the steps a timeline infers,
        such as an expired visibility timeout, are only in `GET /api/messages/{message_id}`.
        PurgeQueue calls are not steps, because they belong to no message.

        The window is `from_ms` to `to_ms`, both included. Without them it is the last `since_s`
        seconds, by default a day.

        Steps are ordered by end time, then trace ID, then span ID, all descending. The order is the
        same on every page and on every store, so pages never overlap or skip a step.
      parameters:
        - $ref: '#/components/parameters/window_from_ms'
        - $ref: '#/components/parameters/window_to_ms'
        - $ref: '#/components/parameters/since_s'
        - name: queue
          in: query
          description: Only steps on this queue. The value is the queue's name, not its URL.
          schema: {type: string}
          example: orders
        - name: service
          in: query
          description: Only steps whose span's resource sets this `service.name`.
          schema: {type: string}
          example: orders-worker
        - name: kind
          in: query
          description: |
            Only steps of these kinds, separated by commas: `send`, `receive`, `delete`,
            `change_visibility`, `outcome`. Without it, every kind.
          schema:
            type: string
            pattern: '^ *(send|receive|delete|change_visibility|outcome) *(, *(send|receive|delete|change_visibility|outcome) *)*$'
          example: delete,change_visibility
        - name: message_id
          in: query
          description: Only the steps of this message, as its timeline places them (see `message_id` in the answer).
          schema: {type: string}
          example: m-orders-1
        - name: limit
          in: query
          description: The largest number of steps in the page.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: One page of steps, and on the first page their counts per time bucket.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
              example:
                from_ms: 1794852336910
                to_ms: 1794852337716
                events:
                - time: '2026-11-16T18:05:37.716000Z'
                  time_unix_nano: '1794852337716000000'
                  start_unix_nano: '1794852337715000000'
                  kind: delete
                  message_id: m-legacy
                  queue: orders
                  service_name: legacy-svc
                  service_version: null
                  result: ok
                  error_code: null
                  outcome: null
                  error_type: null
                  receive_count: null
                  visibility_timeout: null
                  trace_id: bf3be8567ccb1400f14bfc650a51150f
                  span_id: 57dccf6cc3c7c18e
